<svg width="720" height="312" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dadaam — Security research and systems</title>
  <desc id="desc">A dark technical field-note header with a lime signal orb, measurement marks, and orange accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0C0D"/>
      <stop offset="1" stop-color="#151714"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(976 264) rotate(90) scale(166)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8FF5F" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#B8E43C" stop-opacity=".09"/>
      <stop offset="1" stop-color="#B8E43C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#F3EFE1" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" stroke="#F3EFE1" stroke-opacity=".14"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>

  <path d="M58 51H1142" stroke="#F3EFE1" stroke-opacity=".14"/>
  <path d="M58 469H1142" stroke="#F3EFE1" stroke-opacity=".14"/>
  <circle cx="67" cy="51" r="4" fill="#D8FF5F"/>
  <circle cx="86" cy="51" r="4" fill="#FF734D"/>
  <circle cx="105" cy="51" r="4" fill="#F3EFE1" fill-opacity=".35"/>

  <text x="58" y="98" fill="#D8FF5F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2">FIELD NOTE / 00</text>
  <text x="58" y="253" fill="#F3EFE1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="124" font-weight="750" letter-spacing="-7">DADAAM</text>
  <rect x="60" y="279" width="72" height="5" rx="2.5" fill="#FF734D"/>
  <text x="58" y="332" fill="#F3EFE1" fill-opacity=".78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.8">SECURITY RESEARCH  /  SYSTEMS  /  EXPERIMENTS</text>
  <text x="58" y="390" fill="#F3EFE1" fill-opacity=".52" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Build the mechanism. Break the assumption. Measure what remains.</text>

  <circle cx="976" cy="264" r="166" fill="url(#orb)"/>
  <circle cx="976" cy="264" r="118" stroke="#D8FF5F" stroke-opacity=".2"/>
  <circle cx="976" cy="264" r="80" stroke="#D8FF5F" stroke-opacity=".36" stroke-dasharray="2 10"/>
  <circle cx="976" cy="264" r="42" stroke="#F3EFE1" stroke-opacity=".3"/>
  <circle cx="976" cy="264" r="9" fill="#D8FF5F" filter="url(#glow)"/>
  <path d="M976 79V449M791 264H1161" stroke="#F3EFE1" stroke-opacity=".12"/>
  <path d="M976 132V150M976 378V396M844 264H862M1090 264H1108" stroke="#FF734D" stroke-width="2"/>
  <path d="M976 222L1018 264L976 306L934 264L976 222Z" stroke="#F3EFE1" stroke-opacity=".24"/>

  <text x="865" y="112" fill="#F3EFE1" fill-opacity=".4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">48.8566 N</text>
  <text x="1039" y="112" fill="#F3EFE1" fill-opacity=".4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">2.3522 E</text>
  <text x="873" y="425" fill="#D8FF5F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.6">SIGNAL: ACTIVE</text>

  <text x="58" y="493" fill="#F3EFE1" fill-opacity=".38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">PARIS / FR</text>
  <text x="1013" y="493" fill="#F3EFE1" fill-opacity=".38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">BUILD  BREAK  VERIFY</text>
</svg>
